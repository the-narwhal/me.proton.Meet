name: Build and release Flatpak

on:
  push:
    branches: ["main"]
    paths:
      - "me.proton.Meet.yml"
      - "generated-sources.json"
      - "me.proton.Meet.desktop"
      - "me.proton.Meet.metainfo.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # 6-hour max — Electron + Webpack + Yarn monorepo is slow
    timeout-minutes: 360
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            bundle: me.proton.Meet.flatpak
          - arch: aarch64
            runner: ubuntu-24.04-arm
            bundle: me.proton.Meet-aarch64.flatpak

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ matrix.bundle }}
          manifest-path: me.proton.Meet.yml
          # Cache is keyed on arch + generated-sources hash so a clean rebuild
          # happens whenever the npm dependency set changes.
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('generated-sources.json') }}
          upload-artifact: true

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from manifest
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          text = open('me.proton.Meet.yml').read()
          m = re.search(r'tag:\s*proton-meet@([\d.]+)', text)
          print(m.group(1) if m else '0.0.0.0')
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Proton Meet ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            me.proton.Meet.flatpak
            me.proton.Meet-aarch64.flatpak
          body: |
            ## Proton Meet ${{ steps.version.outputs.version }}

            > **Community packaging** — not officially supported by Proton AG.

            ### Install

            Download the bundle for your architecture below and run:

            ```sh
            # x86_64
            flatpak install --user me.proton.Meet.flatpak

            # aarch64 / arm64
            flatpak install --user me.proton.Meet-aarch64.flatpak
            ```

            Then launch with:

            ```sh
            flatpak run me.proton.Meet
            ```

            **Upstream source:** [`proton-meet@${{ steps.version.outputs.version }}`](https://github.com/ProtonMail/WebClients/releases/tag/proton-meet@${{ steps.version.outputs.version }})
