name: Build and release Flatpak

on:
  push:
    branches: ["main"]
    paths:
      # NOTE: me.proton.Meet.yml is intentionally excluded here.
      # When the upstream tag is bumped, me.proton.Meet.yml changes first and
      # triggers update-generated-sources, which then opens a PR to update
      # generated-sources.json.  Merging *that* PR is what triggers the build,
      # ensuring the manifest and generated sources are always in sync.
      # For manifest-only changes (e.g. finish-args tweaks) use workflow_dispatch.
      - "generated-sources.json"
      - "me.proton.Meet.desktop"
      - "me.proton.Meet.metainfo.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    name: Build (x86_64)
    runs-on: ubuntu-latest
    # 6-hour max — Electron + Webpack + Yarn monorepo is slow
    timeout-minutes: 360
    # The flathub-infra container ships flatpak + remotes pre-configured and
    # has a linux/amd64 image, so we use it here as-is.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: me.proton.Meet.flatpak
          manifest-path: me.proton.Meet.yml
          arch: x86_64
          cache-key: flatpak-builder-x86_64-${{ hashFiles('generated-sources.json') }}
          upload-artifact: true

  build-aarch64:
    name: Build (aarch64)
    runs-on: ubuntu-24.04-arm
    # 6-hour max — Electron + Webpack + Yarn monorepo is slow
    timeout-minutes: 360
    # The flathub-infra container image only has a linux/amd64 variant, so
    # using it on an arm64 runner would pull it under emulation and produce
    # an x86_64 bundle regardless of the arch parameter.  Instead, run
    # directly on the native arm64 runner and install flatpak via apt.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder xvfb
          sudo flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # On bare GitHub-hosted runners the polkit system helper rejects
          # system-wide flatpak operations (GetRevokefsFd, Deploy) from
          # non-root users.  A JS rule in rules.d grants unconditional YES
          # for all org.freedesktop.Flatpak.* actions in CI.
          sudo tee /etc/polkit-1/rules.d/10-flatpak-ci.rules > /dev/null << 'POLKIT'
          polkit.addRule(function(action, subject) {
              if (action.id.indexOf("org.freedesktop.Flatpak") === 0) {
                  return polkit.Result.YES;
              }
          });
          POLKIT
          sudo systemctl restart polkit
          # Pre-install the runtimes as root so the action's dep-install
          # step is a fast no-op rather than a full download.
          sudo flatpak install -y --noninteractive flathub \
            org.freedesktop.Platform/aarch64/25.08 \
            org.freedesktop.Sdk/aarch64/25.08 \
            org.freedesktop.Sdk.Extension.node22/aarch64/25.08 \
            org.electronjs.Electron2.BaseApp/aarch64/25.08

      - name: Shim xvfb-run for arm64
        run: |
          # Xvfb doesn't start reliably on GitHub-hosted arm64 runners.
          # The flatpak-builder action unconditionally wraps its build command
          # with xvfb-run, but the build itself has no GUI and doesn't need a
          # display.  Replace xvfb-run with a pass-through shim that strips its
          # own flags and exec's whatever command was passed to it.
          sudo tee /usr/local/bin/xvfb-run > /dev/null << 'EOF'
          #!/bin/sh
          while [ $# -gt 0 ]; do
            case "$1" in
              -a|--auto-servernum) shift ;;
              -e|--error-file|-n|--server-num|-p|--server-args|-w|--wait) shift 2 ;;
              --) shift; break ;;
              -*) shift ;;
              *) break ;;
            esac
          done
          exec "$@"
          EOF
          sudo chmod +x /usr/local/bin/xvfb-run

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: me.proton.Meet-aarch64.flatpak
          manifest-path: me.proton.Meet.yml
          arch: aarch64
          cache-key: flatpak-builder-aarch64-${{ hashFiles('generated-sources.json') }}
          upload-artifact: true

  release:
    name: Publish GitHub Release
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from manifest
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          text = open('me.proton.Meet.yml').read()
          m = re.search(r'tag:\s*proton-meet@([\d.]+)', text)
          print(m.group(1) if m else '0.0.0.0')
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Proton Meet ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            me.proton.Meet.flatpak
            me.proton.Meet-aarch64.flatpak
          body: |
            ## Proton Meet ${{ steps.version.outputs.version }}

            > **Community packaging** — not officially supported by Proton AG.

            ### Install

            Download the bundle for your architecture below and run:

            ```sh
            # x86_64
            flatpak install --user me.proton.Meet.flatpak

            # aarch64 / arm64
            flatpak install --user me.proton.Meet-aarch64.flatpak
            ```

            Then launch with:

            ```sh
            flatpak run me.proton.Meet
            ```

            **Upstream source:** [`proton-meet@${{ steps.version.outputs.version }}`](https://github.com/ProtonMail/WebClients/releases/tag/proton-meet@${{ steps.version.outputs.version }})
